global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'main-server'
    static_configs:
      - targets: ['MAIN_SERVER_IP:9100']
        labels:
          instance: 'main-server'
          env: 'production'